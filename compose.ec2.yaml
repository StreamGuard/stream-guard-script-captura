services:
  banco:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - banco.env
    # Reduz o consumo na instância de estudante.
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --performance-schema=OFF
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h 127.0.0.1 -u root -e "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build:
      context: ./stream-guard-site-institucional
      dockerfile: ../stream-guard-script-captura/Dockerfile.api
    restart: unless-stopped
    env_file:
      - api.env
    ports:
      - "3333:3333"
    depends_on:
      banco:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const q=require('http').get('http://127.0.0.1:3333/metricas/configuracoes/1',r=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1))});q.setTimeout(5000,()=>{q.destroy();process.exit(1)});q.on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 30s
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  java:
    build:
      context: ./StreamGuardLogs
      dockerfile: ../stream-guard-script-captura/Dockerfile.java
    restart: unless-stopped
    env_file:
      - java.env
    volumes:
      - estado_java:/estado
    depends_on:
      api:
        condition: service_healthy
    logging:
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  dados_mysql:
  estado_java:
